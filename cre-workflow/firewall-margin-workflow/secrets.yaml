# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the workflow-facing secret IDs requested with `runtime.getSecrets()` to
# the environment variables holding their values. These are the "private
# liquidation policy thresholds" from the task brief — in a real deployment
# these are the operator's actual confidential risk limits, released by the
# Vault DON only into the attested enclave. Here they are mocked for local
# simulation via .env.
secretsNames:
  MIN_HEALTH_FACTOR:
    - MOCK_MIN_HEALTH_FACTOR
  LIQUIDATION_LTV_THRESHOLD:
    - MOCK_LIQUIDATION_LTV_THRESHOLD
  MAX_CROSS_PROTOCOL_EXPOSURE_USD:
    - MOCK_MAX_CROSS_PROTOCOL_EXPOSURE_USD
  MAX_LIQUIDATION_PCT:
    - MOCK_MAX_LIQUIDATION_PCT
