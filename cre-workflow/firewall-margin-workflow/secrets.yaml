# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps workflow-facing secret IDs requested with `runtime.getSecrets()` to the
# environment variables holding their values. In a deployment these are released
# by the Vault DON only into the attested enclave.
#
# Two kinds of secret live here, and both are load-bearing:
#
#   - the risk policy itself (where the liquidation line sits, how much of a
#     position may be taken, how much external exposure is tolerated). This is
#     the part a competitor could trade against if it were public.
#   - the Graph gateway credential, used to query live market data from inside
#     the enclave. It never appears in config, in a log line, or in the report.
secretsNames:
  MIN_HEALTH_FACTOR:
    - POLICY_MIN_HEALTH_FACTOR
  LIQUIDATION_LTV_THRESHOLD:
    - POLICY_LIQUIDATION_LTV_THRESHOLD
  MAX_CROSS_PROTOCOL_EXPOSURE_USD:
    - POLICY_MAX_CROSS_PROTOCOL_EXPOSURE_USD
  MAX_LIQUIDATION_PCT:
    - POLICY_MAX_LIQUIDATION_PCT
  MAX_MARKET_STRESS_BPS:
    - POLICY_MAX_MARKET_STRESS_BPS
  GRAPH_API_KEY:
    - CRE_GRAPH_API_KEY
